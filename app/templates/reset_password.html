{% extends "base.html" %}
{% block title %}Nieuw wachtwoord — {{ site_name }}{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Nieuw wachtwoord instellen</h1>
  <p class="subtitle">Kies een nieuw wachtwoord voor je account.</p>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">Nieuw wachtwoord</label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" autofocus>
    <small>Minimaal 8 tekens</small>

    <label for="password2">Wachtwoord bevestigen</label>
    <input type="password" id="password2" name="password2" required autocomplete="new-password">

    <button type="submit" class="btn btn-primary">Wachtwoord opslaan</button>
  </form>
</div>
{% endblock %}
