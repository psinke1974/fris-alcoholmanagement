{% extends "base.html" %}
{% block title %}Wachtwoord vergeten — {{ site_name }}{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Wachtwoord vergeten</h1>
  <p class="subtitle">Vul je e-mailadres in. Als het bij ons bekend is, sturen we een resetlink.</p>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mailadres</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus>

    <button type="submit" class="btn btn-primary">Resetlink versturen</button>
  </form>

  <p class="auth-footer"><a href="{{ url_for('auth.login') }}">Terug naar inloggen</a></p>
</div>
{% endblock %}
